name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Builds, tests and packages the release configuration. The same packages
  # are published by the release job below, so what is tested is what ships.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: bright-dawn-linux-x86_64.tar.gz
            tar: czf
            format: ""
          - os: windows-2022
            asset: bright-dawn-windows-x86_64.zip
            tar: cf
            format: --format=zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Builds from main are published, so they carry their release label;
      # the release job below derives the tag from the same run number.
      - name: Configure
        run: |
          build_id=dev
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then build_id="pre.$GITHUB_RUN_NUMBER"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBD_STATIC_RUNTIME=ON \
            -DBD_BUILD_ID="$build_id" -DBD_COMMIT="${GITHUB_SHA::7}"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          cmake --install build --config Release --prefix package/bright-dawn
          package/bright-dawn/bdtool --version
          cd package
          cmake -E tar ${{ matrix.tar }} ${{ matrix.asset }} ${{ matrix.format }} -- bright-dawn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: package/${{ matrix.asset }}
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBD_SANITIZE=ON -DBD_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Every push to main that passes the jobs above is published as a
  # pre-release. Packages contain the tools only: no ROM and no game data.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(BrightDawn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v${version}-pre.${GITHUB_RUN_NUMBER}"
          (cd dist && sha256sum bright-dawn-* > SHA256SUMS.txt)
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bright Dawn $tag" \
            --notes-file .github/prerelease-notes.md \
            --generate-notes
