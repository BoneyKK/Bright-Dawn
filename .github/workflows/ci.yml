name: CI

on:
  # Branches only: the tags are made by the release job, after the checks.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # Builds, tests and packages the release configuration. The same packages
  # are published by the release job below, so what is tested is what ships.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: bright-dawn-linux-x86_64.tar.gz
            tar: czf
            format: ""
          - os: windows-2022
            asset: bright-dawn-windows-x86_64.zip
            tar: cf
            format: --format=zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The guest test image is cross-compiled for ARM with Clang and LLD.
      # SDL, built into the window program, needs the headers of the window
      # systems, controllers and sound systems it is to support; it loads
      # their libraries while it runs, so the package does not need them.
      - name: Install the ARM cross-toolchain and SDL's build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y clang lld llvm
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev
          libudev-dev libdbus-1-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdecor-0-dev
      # Builds from main are published, so they carry their release label;
      # the release job below derives the tag from the same run number.
      - name: Configure
        run: |
          build_id=dev
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then build_id="pre.$GITHUB_RUN_NUMBER"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBD_STATIC_RUNTIME=ON \
            -DBD_BUILD_ID="$build_id" -DBD_COMMIT="${GITHUB_SHA::7}"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          cmake --install build --config Release --prefix package/bright-dawn
          # Only what a player needs: the program, its licences, and the
          # builder, with which the launcher builds the game library.
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          expected=$(printf '%s\n' LICENSE.txt "bright-dawn$exe" licenses/DearImGui.txt licenses/SDL3.txt \
            licenses/SkyEmu.txt | LC_ALL=C sort)
          actual=$(cd package/bright-dawn && find . -type f -not -path './builder/*' | sed 's|^[.]/||' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "The package holds:"; echo "$actual"; echo "It should hold:"; echo "$expected"; exit 1
          fi
          # The builder: the translator and what the translated code is
          # compiled with, and nothing else (the program reads the code out of
          # the ROM itself; the compiler, and Python on Windows, are fetched).
          builder_expected=$( (printf '%s\n' LICENSE src/runtime/ds_cpu.h src/runtime/translated_table.h \
            src/runtime/game_library.h src/runtime/game_library_glue.cpp; git ls-files tools/gamebuilder tools/translator) \
            | LC_ALL=C sort)
          builder_actual=$(cd package/bright-dawn/builder && find . -type f | sed 's|^[.]/||' | LC_ALL=C sort)
          if [ "$builder_actual" != "$builder_expected" ]; then
            echo "The builder holds:"; echo "$builder_actual"; echo "It should hold:"; echo "$builder_expected"; exit 1
          fi
          py=python3; if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" package/bright-dawn/builder/tools/gamebuilder/build_game.py --help > /dev/null
          package/bright-dawn/bright-dawn --version
          # The window must be able to open on the systems the package is for.
          drivers=$(package/bright-dawn/bright-dawn --video-drivers)
          echo "$drivers"
          if [ "$RUNNER_OS" = Linux ]; then
            echo "$drivers" | grep -qx x11 && echo "$drivers" | grep -qx wayland
          else
            echo "$drivers" | grep -qx windows
          fi
          cd package
          cmake -E tar ${{ matrix.tar }} ${{ matrix.asset }} ${{ matrix.format }} -- bright-dawn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: package/${{ matrix.asset }}
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # SDL will not configure on Linux without X11 or Wayland headers.
      - name: Install the ARM cross-toolchain and SDL's build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y clang lld llvm
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev
          libudev-dev libdbus-1-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdecor-0-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBD_SANITIZE=ON -DBD_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # A second compiler: Clang reports things GCC and MSVC accept.
  clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang, the ARM cross-toolchain and SDL's build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y clang lld llvm
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev
          libudev-dev libdbus-1-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdecor-0-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBD_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The description of the pre-release: the state, the changes since the
  # last pre-release, then how to start. Made on every push, so a branch's
  # run shows (in its summary) what main's release would say.
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Every commit and tag, to find the last pre-release.
      - name: Test the notes writer
        run: python3 -m unittest discover -s tools/release -v
      - name: Write the notes
        run: |
          version=$(sed -n 's/^project(BrightDawn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          python3 tools/release/release_notes.py --tag "v${version}-pre.${GITHUB_RUN_NUMBER}" \
            --repository "$GITHUB_REPOSITORY" --out release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Every push to main that passes the jobs above is published as a
  # pre-release. Packages contain the tools only: no ROM and no game data.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sanitizers, clang, notes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bright-dawn-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(BrightDawn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v${version}-pre.${GITHUB_RUN_NUMBER}"
          (cd dist && sha256sum bright-dawn-* > SHA256SUMS.txt)
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bright Dawn $tag" \
            --notes-file release-notes.md
